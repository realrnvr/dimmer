[package]
name = "dimmer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Display dimmer for GNOME on Wayland"

[dependencies]
anyhow.workspace = true
dimmer-core = { path = "../dimmer-core" }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4", "gtk_v4_10"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "time", "sync"] }
zbus = { version = "6.1", features = ["tokio"] }

[lints]
workspace = true
