name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install release build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-4-dev libadwaita-1-dev pkg-config gjs gnome-shell dbus-x11 unzip
      - name: Ensure tag matches the app version
        working-directory: .
        run: |
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "dimmer"))')
          tag_version=${GITHUB_REF_NAME#v}
          test "$package_version" = "$tag_version" || {
            echo "Release tag $GITHUB_REF_NAME does not match Cargo version $package_version" >&2
            exit 1
          }
      - name: Verify Rust code
        working-directory: .
        run: |
          cargo fmt --all --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test GitHub release installer
        run: sh scripts/tests/install-release.sh
      - name: Build application
        working-directory: .
        run: cargo build --locked --release --package dimmer
      - name: Package GNOME extension
        working-directory: .
        run: scripts/pack-extension.sh
      - name: Check extension metadata, geometry and colour math
        working-directory: .
        run: |
          gjs -m gnome-extension/tests/metadata.test.js
          gjs -m gnome-extension/tests/overlay-math.test.js
          gjs -m gnome-extension/tests/window-reset.test.js
      - name: Check extension in private GNOME Shell sessions
        working-directory: .
        run: |
          DIMMER_BIN=$PWD/target/release/dimmer timeout 240 \
            dbus-run-session -- bash gnome-extension/tests/headless-shell.sh
          DIMMER_BIN=$PWD/target/release/dimmer timeout 180 \
            dbus-run-session -- bash gnome-extension/tests/multimon-shell.sh
      - name: Stage release assets
        working-directory: .
        run: |
          mkdir -p release
          mkdir -p release-bundle/data/icons/hicolor/scalable/apps
          install -Dm755 target/release/dimmer release-bundle/dimmer
          install -Dm755 scripts/install.sh release-bundle/scripts/install.sh
          install -Dm644 data/io.github.dimmer.Linux.desktop release-bundle/data/io.github.dimmer.Linux.desktop
          install -Dm644 data/io.github.dimmer.Linux.metainfo.xml release-bundle/data/io.github.dimmer.Linux.metainfo.xml
          install -Dm644 data/icons/hicolor/scalable/apps/io.github.dimmer.Linux.svg \
            release-bundle/data/icons/hicolor/scalable/apps/io.github.dimmer.Linux.svg
          install -Dm644 LICENSE release-bundle/LICENSE
          tar -C release-bundle -czf release/dimmer-linux-x86_64.tar.gz \
            LICENSE dimmer scripts data
          install -Dm755 scripts/install-release.sh release/install.sh
          cp dist/dimmer@dimmer.linux.shell-extension.zip release/
          (cd release && sha256sum dimmer-linux-x86_64.tar.gz install.sh \
            dimmer@dimmer.linux.shell-extension.zip > SHA256SUMS)
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes
